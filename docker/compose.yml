services:
  app:
    build:
      context: .
      args:
        REDMICA: master
        RUBY_VERSION: ${RUBY_VERSION:-4.0}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    tty: true
    environment:
      AWS_REGION: ap-northeast-1
      AWS_ENDPOINT_URL: http://s3.localhost:4566
      CAPYBARA_SERVER_HOST: app
      CAPYBARA_SERVER_PORT: 8080
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      GOOGLE_CHROME_OPTS_ARGS: headless,disable-gpu,no-sandbox,disable-dev-shm-usage
    volumes:
      - ..:/redmica/plugins/redmica_s3
      - ../tmp/screenshots:/redmica/tmp/screenshots
      - bundle_cache:/usr/local/bundle
    healthcheck:
      # The entrypoint creates tmp/.ready once its setup steps are complete.
      test: test -f tmp/.ready
      interval: 10s
      start_period: 5m
      retries: 5

  db:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: |
        pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: floci/floci:2.5.0
    environment:
      FLOCI_BASE_URL: http://s3.localhost:4566
      FLOCI_STORAGE_MODE: memory
      # Write S3 objects to /app/data/s3 so they can be inspected as files.
      FLOCI_STORAGE_SERVICES_S3_MODE: persistent
    ports:
      - '127.0.0.1:4566:4566'
    # Keep /app/data on tmpfs. The image's entrypoint chowns it for the floci user.
    tmpfs:
      - /app/data
    networks:
      default:
        aliases:
          - 's3.localhost'
          - 'redmine-bucket.s3.localhost'
    # The image has no curl, so use the healthcheck script it ships with.
    healthcheck:
      test: /usr/local/bin/healthcheck.sh
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  selenium:
    image: selenium/standalone-chromium:136.0

volumes:
  bundle_cache:
  postgres_data:
